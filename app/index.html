<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <!-- Short link for the TV: krelbaum.github.io/myiptv/app → latest APK.
         Static on purpose: the Downloader app on Android TV just follows the
         redirect, no JS or sign-in needed. The "latest" URL is stable across
         releases (tv-android.yml publishes to Krelbaum/myiptv). -->
    <meta http-equiv="refresh" content="0; url=https://github.com/Krelbaum/myiptv/releases/latest/download/myiptv-tv.apk" />
    <title>myIPTV — приложение для Android TV</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1116; color: #f2f4f7;
             font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 520px; }
      h1 { font-size: 26px; margin: 0 0 8px; }
      p { color: #9aa3b2; margin: 0 0 20px; }
      a.btn { display: inline-block; background: #e53950; color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>myIPTV для Android TV</h1>
      <p>Загрузка начнётся автоматически. Если нет, нажмите кнопку.</p>
      <a class="btn" href="https://github.com/Krelbaum/myiptv/releases/latest/download/myiptv-tv.apk">Скачать APK</a>
      <p style="margin-top: 24px; font-size: 15px">
        На телевизоре: установите приложение Downloader, введите в нём адрес этой страницы
        и подтвердите установку.
      </p>
    </main>
  </body>
</html>
